# Conda env for diegomics/gabi_base container
# version: 0.2.2
# (all dependencies, exact URLs) is saved in the image at
# /opt/gabi_base_docker_env.lock.txt
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python (3.11: SafeConfigParser was removed in 3.12, needed by some tools)
  - python==3.11.16

  # Core utilities
  - pigz==2.8
  - seqtk==1.5
  - seqkit==2.13.0
  - csvtk==0.37.0
  - tqdm==4.70.1

  # Read processing
  - fastp==1.4.0
  - bbmap==40.02

  # QC
  - fastqc==0.12.1
  - nanoplot==1.46.2
  - python-kaleido==0.2.1
  - multiqc==1.35

  # Assembly evaluation
  - gfastats==1.3.11

  # Alignment
  - bwa-mem2==2.3
  - minibwa==0.7
  - minimap2==2.31

  # BAM/SAM (sambamba requires lz4-c<1.10)
  - samtools==1.24
  - bamtools==2.5.3
  - sambamba==1.0.1
  - mosdepth==0.3.14

  # BED
  - bedops==2.4.42
  - bedtools==2.31.1

  # Variant calling and population genetics
  - conda-forge::gsl==2.7
  - bioconda::bcftools==1.24
  - psmc==0.6.5
  - bioconda::msmc2==2.1.4

  # Sequence search
  - blast==2.17.0

  # Data download
  - bioconda::entrez-direct==26.0
  - bioconda::enabrowsertools==1.7.2
  - conda-forge::aria2==1.37.0

  # Python scientific libraries
  - numpy==2.4.6
  - scipy==1.17.1

  # R
  - r-base==4.5.3
  - r-rcolorbrewer==1.1_3
  - r-ggplot2==4.0.3
  - r-dplyr==1.2.1
  - r-tidyr==1.3.2
  - r-scales==1.4.0
  - r-data.table==1.18.6.1
  - r-gridextra==2.3.1
  - r-optparse==1.8.2
